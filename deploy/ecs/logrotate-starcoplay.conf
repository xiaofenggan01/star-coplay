/var/log/starcoplay/systemd/*.log {
    daily
    rotate 7
    maxage 7
    missingok
    notifempty
    compress
    delaycompress
    dateext
    copytruncate
    create 0640 root adm
    sharedscripts
    postrotate
        find /var/log/starcoplay/sessions -mindepth 1 -type f -mtime +7 -delete 2>/dev/null || true
        find /var/log/starcoplay/sessions -mindepth 1 -type d -empty -mtime +7 -delete 2>/dev/null || true
    endscript
}
