# NewAPI Docker Compose for star-coplay local/staging.
#
# Quick start:
#   1. Copy .env.example to .env and change passwords.
#   2. docker compose up -d
#   3. Access NewAPI at http://127.0.0.1:${NEWAPI_HOST_PORT:-13000}
#
# PostgreSQL and Redis are only reachable inside the Docker network.

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: star-coplay-newapi
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "127.0.0.1:${NEWAPI_HOST_PORT:-13000}:3000"
    volumes:
      - newapi_data:/data
      - newapi_logs:/app/logs
    environment:
      - SQL_DSN=postgresql://${NEWAPI_POSTGRES_USER:-newapi}:${NEWAPI_POSTGRES_PASSWORD:-newapi_local_postgres_password}@postgres:5432/${NEWAPI_POSTGRES_DB:-new-api}
      - REDIS_CONN_STRING=redis://:${NEWAPI_REDIS_PASSWORD:-newapi_local_redis_password}@redis:6379/0
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=${NEWAPI_ERROR_LOG_ENABLED:-true}
      - BATCH_UPDATE_ENABLED=${NEWAPI_BATCH_UPDATE_ENABLED:-true}
      - NODE_NAME=${NEWAPI_NODE_NAME:-star-coplay-newapi-local}
      - STREAMING_TIMEOUT=${NEWAPI_STREAMING_TIMEOUT:-300}
      - SESSION_SECRET=${NEWAPI_SESSION_SECRET:-local-newapi-session-secret-change-me}
      - GLOBAL_API_RATE_LIMIT_ENABLE=${NEWAPI_GLOBAL_API_RATE_LIMIT_ENABLE:-false}
      - CRITICAL_RATE_LIMIT_ENABLE=${NEWAPI_CRITICAL_RATE_LIMIT_ENABLE:-false}
      - SEARCH_RATE_LIMIT_ENABLE=${NEWAPI_SEARCH_RATE_LIMIT_ENABLE:-false}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - newapi_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\":[[:space:]]*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: star-coplay-newapi-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${NEWAPI_REDIS_PASSWORD:-newapi_local_redis_password}"]
    environment:
      - REDIS_PASSWORD=${NEWAPI_REDIS_PASSWORD:-newapi_local_redis_password}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - newapi_network

  postgres:
    image: postgres:15-alpine
    container_name: star-coplay-newapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NEWAPI_POSTGRES_USER:-newapi}
      POSTGRES_PASSWORD: ${NEWAPI_POSTGRES_PASSWORD:-newapi_local_postgres_password}
      POSTGRES_DB: ${NEWAPI_POSTGRES_DB:-new-api}
    volumes:
      - newapi_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - newapi_network

volumes:
  newapi_data:
  newapi_logs:
  newapi_postgres:

networks:
  newapi_network:
    driver: bridge
