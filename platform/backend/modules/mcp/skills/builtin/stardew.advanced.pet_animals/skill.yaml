id: stardew.advanced.pet_animals
version: 1.0.0
description: Find and pet unpetted farm animals or pets within radius 50 on the current map
game: stardew-valley
entrypoint: implementation:run
input_schema:
  type: object
  properties:
    max_count: {type: integer, minimum: 0, maximum: 50}
  additionalProperties: false
output_schema:
  type: object
  properties:
    status: {type: string, enum: [completed, partial, failed]}
    summary: {type: string, maxLength: 2000}
    data_json: {type: string, maxLength: 5000}
    truncated: {type: boolean}
  required: [status, summary, data_json, truncated]
  additionalProperties: false
requires:
  capabilities:
    - {id: query_runtime_snapshot, version: ">=2.4.5,<3.0.0"}
    - {id: query_world_region, version: ">=2.4.5,<3.0.0"}
    - {id: execute_on_targets, version: ">=2.4.5,<3.0.0"}
risk: [changes_save]
timeout_seconds: 240
cancellable: true
retry: never
failure_codes: [capability_failed, timeout, cancelled]
execution_mode: background
