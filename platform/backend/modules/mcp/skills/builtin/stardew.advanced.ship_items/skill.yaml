id: stardew.advanced.ship_items
version: 1.0.0
description: Preview or execute a bounded shipping-bin plan
game: stardew-valley
entrypoint: implementation:run
input_schema:
  type: object
  properties:
    items: {type: array, maxItems: 40, items: {type: string, minLength: 1}}
    exclude: {type: array, maxItems: 40, items: {type: string, minLength: 1}}
    min_quality: {type: string, enum: [silver, gold, iridium]}
    dry_run: {type: boolean}
  additionalProperties: false
output_schema:
  type: object
  properties:
    status: {type: string, enum: [completed, partial, failed]}
    summary: {type: string, maxLength: 2000}
    data_json: {type: string, maxLength: 5000}
    truncated: {type: boolean}
  required: [status, summary, data_json, truncated]
  additionalProperties: false
requires:
  capabilities:
    - {id: ship_items, version: ">=2.4.5,<3.0.0"}
risk: [changes_save]
timeout_seconds: 60
cancellable: false
retry: never
failure_codes: [capability_failed, timeout, cancelled]
