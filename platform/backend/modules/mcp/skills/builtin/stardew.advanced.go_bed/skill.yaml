id: stardew.advanced.go_bed
version: 1.0.0
description: Return home and sleep through normal navigation and bed interaction
game: stardew-valley
entrypoint: implementation:run
input_schema: {type: object, additionalProperties: false}
output_schema:
  type: object
  properties:
    status: {type: string, enum: [completed, partial, failed]}
    summary: {type: string, maxLength: 2000}
    data_json: {type: string, maxLength: 5000}
    truncated: {type: boolean}
  required: [status, summary, data_json, truncated]
  additionalProperties: false
requires:
  capabilities:
    - {id: go_to_bed, version: ">=2.4.5,<3.0.0"}
risk: [advances_time, changes_save]
timeout_seconds: 240
cancellable: true
retry: never
failure_codes: [capability_failed, timeout, cancelled]
execution_mode: background
