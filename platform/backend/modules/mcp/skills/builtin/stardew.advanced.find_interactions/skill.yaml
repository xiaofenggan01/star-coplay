id: stardew.advanced.find_interactions
version: 1.0.0
description: List bounded opaque interaction candidates in the current view
game: stardew-valley
entrypoint: implementation:run
input_schema:
  type: object
  properties:
    limit: {type: integer, minimum: 1, maximum: 20}
    offset: {type: integer, minimum: 0, maximum: 500}
  additionalProperties: false
output_schema:
  type: object
  properties:
    status: {type: string, enum: [completed, partial, failed]}
    summary: {type: string, maxLength: 2000}
    data_json: {type: string, maxLength: 5000}
    truncated: {type: boolean}
  required: [status, summary, data_json, truncated]
  additionalProperties: false
requires:
  capabilities:
    - {id: query_world_region, version: ">=2.4.5,<3.0.0"}
risk: []
timeout_seconds: 30
cancellable: false
retry: never
failure_codes: [capability_failed, timeout, cancelled]
