id: stardew.advanced.harvest_crops
version: 1.0.0
description: Harvest ready crops on the current map with optional replanting
game: stardew-valley
entrypoint: implementation:run
input_schema:
  type: object
  properties:
    max_count: {type: integer, minimum: 1, maximum: 100}
    replant_seed: {type: string, minLength: 1, maxLength: 120}
  additionalProperties: false
output_schema:
  type: object
  properties:
    status: {type: string, enum: [completed, partial, failed]}
    summary: {type: string, maxLength: 2000}
    data_json: {type: string, maxLength: 5000}
    truncated: {type: boolean}
  required: [status, summary, data_json, truncated]
  additionalProperties: false
requires:
  capabilities:
    - {id: harvest_crops, version: ">=2.4.5,<3.0.0"}
risk: [changes_save]
timeout_seconds: 240
cancellable: true
retry: never
failure_codes: [capability_failed, timeout, cancelled]
execution_mode: background
