id: stardew.proto.use_tool
version: 1.0.0
description: Builtin Proto use_tool capability wrapper
game: stardew-valley
entrypoint: implementation:run
input_schema: {type: object, additionalProperties: false}
output_schema: {type: object, additionalProperties: false}
requires:
  capabilities:
    - id: use_tool
      version: ">=2.4.5,<3.0.0"
risk: [changes_save, consumes_energy]
timeout_seconds: 30
cancellable: false
retry: never
failure_codes: [capability_failed, timeout, cancelled]
