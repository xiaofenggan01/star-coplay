id: stardew.knowledge.search_wiki
version: 1.0.0
description: Search the bundled Stardew Valley Wiki with bounded results
game: stardew-valley
entrypoint: implementation:run
input_schema:
  type: object
  properties:
    query: {type: string, minLength: 1, maxLength: 200}
    limit: {type: integer, minimum: 1, maximum: 8}
  required: [query]
  additionalProperties: false
output_schema:
  type: object
  properties:
    status: {type: string, enum: [completed]}
    content: {type: string, maxLength: 4096}
    result_limit: {type: integer, minimum: 1, maximum: 8}
    truncated: {type: boolean}
  required: [status, content, result_limit, truncated]
  additionalProperties: false
requires: {capabilities: []}
risk: []
timeout_seconds: 10
cancellable: false
retry: never
failure_codes: [knowledge_unavailable]
