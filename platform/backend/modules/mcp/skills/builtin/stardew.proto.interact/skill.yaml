id: stardew.proto.interact
version: 1.0.0
description: Builtin Proto interact capability wrapper
game: stardew-valley
entrypoint: implementation:run
input_schema: {type: object, additionalProperties: false}
output_schema: {type: object, additionalProperties: false}
requires:
  capabilities:
    - id: interact
      version: ">=2.4.5,<3.0.0"
risk: [changes_save]
timeout_seconds: 30
cancellable: false
retry: never
failure_codes: [capability_failed, timeout, cancelled]
