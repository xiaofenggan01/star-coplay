id: stardew.advanced.search_facts
version: 1.0.0
description: Filter and page compact facts from the current game view
game: stardew-valley
entrypoint: implementation:run
input_schema:
  type: object
  properties:
    fact_type: {type: string, minLength: 1, maxLength: 64}
    filters_json: {type: string, maxLength: 2000}
    sort: {type: string, maxLength: 80}
    limit: {type: integer, minimum: 1, maximum: 20}
    offset: {type: integer, minimum: 0, maximum: 500}
  required: [fact_type]
  additionalProperties: false
output_schema:
  type: object
  properties:
    status: {type: string, enum: [completed, partial, failed]}
    summary: {type: string, maxLength: 2000}
    data_json: {type: string, maxLength: 5000}
    truncated: {type: boolean}
  required: [status, summary, data_json, truncated]
  additionalProperties: false
requires:
  capabilities:
    - {id: query_world_region, version: ">=2.4.5,<3.0.0"}
risk: []
timeout_seconds: 30
cancellable: false
retry: never
failure_codes: [capability_failed, timeout, cancelled, invalid_arguments]
