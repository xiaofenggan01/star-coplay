id: stardew.advanced.water_crops
version: 1.0.0
description: Water crops on the current map using the Mod compound workflow
game: stardew-valley
entrypoint: implementation:run
input_schema:
  type: object
  properties:
    max_count: {type: integer, minimum: 1, maximum: 50}
  additionalProperties: false
output_schema: &advanced_output
  type: object
  properties:
    status: {type: string, enum: [completed, partial, failed]}
    summary: {type: string, maxLength: 2000}
    data_json: {type: string, maxLength: 5000}
    truncated: {type: boolean}
  required: [status, summary, data_json, truncated]
  additionalProperties: false
requires:
  capabilities:
    - {id: water_crops, version: ">=2.4.5,<3.0.0"}
risk: [changes_save, consumes_energy]
timeout_seconds: 240
cancellable: true
retry: never
failure_codes: [capability_failed, timeout, cancelled]
execution_mode: background
