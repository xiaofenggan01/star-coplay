[tool.poetry]
name = "stardew-agent"
version = "0.1.0"
description = "星露谷物语 AI Agent V2 — 双环架构（快环 BT + 慢环 LLM）"
authors = ["luosea"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
py_trees = "~2.2.3"
watchdog = "^4.0"
openai = ">=1.0.0"
certifi = ">=2024.0"
protobuf = ">=5.0"
grpcio-tools = ">=1.62,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
mypy = "^1.9"
ruff = "^0.4"

[tool.poetry.scripts]
stardew-agent = "main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
